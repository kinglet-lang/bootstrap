name: Auto Merge

on:
  workflow_run:
    workflows: [CI, Lint, Validate PR]
    types: [completed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        if: vars.AUTOMERGE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge on ready PRs
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # A PR is ready for auto-merge when:
          #   1. All CI status checks have passed.  Checks with a null or
          #      empty conclusion (e.g. CodeRabbit status context) are
          #      ignored, not counted as failures.
          #   2. The PR is mergeable
          prs=$(gh pr list -R "$REPO" --state open \
            --json number,statusCheckRollup,mergeable \
            --jq '.[]
              | select(.statusCheckRollup
                  | map(select(.conclusion != null and .conclusion != "" and .conclusion != "SUCCESS"))
                  | length == 0)
              | select(.mergeable == "MERGEABLE")
              | .number' \
            | sort -n)

          if [ -z "$prs" ]; then
            echo "No PRs with all checks passed."
            exit 0
          fi

          echo "PRs ready for auto-merge: $prs"
          for num in $prs; do
            echo "Enabling auto-merge for PR #$num..."

            # Extract only the Summary section of the PR body as the commit body.
            pr_body=$(gh api "repos/$REPO/pulls/$num" --jq '.body' \
              | sed -n '/^\*\*Summary\*\*$/,/^\*\*[A-Z]/p' \
              | sed '1d; $d' \
              | sed '/^[[:space:]]*$/d')

            gh pr merge "$num" --auto --squash --body "$pr_body"
            echo "  Auto-merge enabled."
          done
