name: Auto Merge

on:
  workflow_run:
    workflows: [CI, Lint, Validate PR]
    types: [completed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        if: vars.AUTOMERGE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge ready PRs
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # A PR is ready to merge when:
          #   1. All CI status checks have passed (no failures or pendings).
          #   2. kinglet-reviewer has submitted an APPROVED review.
          #   3. The PR is mergeable.
          #
          # kinglet-reviewer is a self-hosted GitHub App that posts a review
          # with event=APPROVE when the LLM finds no issues, or event=COMMENT
          # with inline comments when it does.  We check the reviews list
          # (not statusCheckRollup) for an APPROVED review from the bot.
          #
          # We merge directly (not --auto) so the action is synchronous and
          # we can delete fork branches in the same run.

          # Fetch all open, mergeable PRs with their check rollup and reviews.
          prs_json=$(gh pr list -R "$REPO" --state open \
            --json number,statusCheckRollup,mergeable,headRepository,headRepositoryOwner,headRefName,reviews)

          # Filter to PRs that are ready.
          #
          # statusCheckRollup is append-only: when a check re-runs (e.g. after
          # a push or close/reopen), the new run is added alongside the old
          # one rather than replacing it. Group by check name (or context,
          # for legacy status contexts) and look only at the most recent run
          # so a stale FAILURE from an earlier commit doesn't block merge.
          ready=$(echo "$prs_json" | jq '
            def check_key: .name // .context // "";
            # A run that has not finished yet (no timestamps, e.g. QUEUED) is
            # logically the newest, so sort it last by falling back to a
            # high sentinel rather than the empty string.
            def check_time: (.completedAt // .startedAt // "9999");
            .[]
            | select(.mergeable == "MERGEABLE")
            | select(
                .statusCheckRollup as $checks
                | (
                    # 1. Latest run of each distinct check must be SUCCESS.
                    #    - Group by name/context so old runs are shadowed by new.
                    #    - Within a group, sort by completedAt/startedAt and take
                    #      the last (most recent) entry.
                    #    - Check-runs with conclusion FAILURE/CANCELLED/etc -> block
                    #    - Check-runs with null conclusion (still running) -> block
                    #    - Status contexts with state ERROR/FAILURE/PENDING -> block
                    #    - Status contexts with state SUCCESS -> ok
                    $checks
                    | group_by(check_key)
                    | map(sort_by(check_time) | last)
                    | map(
                        ( .conclusion // .state ) as $result
                        | select($result != "SUCCESS")
                      )
                    | length == 0
                  )
                  and (
                    # 2. kinglet-reviewer has submitted an APPROVED review.
                    .reviews
                    | any((.author.login | startswith("kinglet-reviewer")) and .state == "APPROVED")
                  )
              )
            | .number
          ' | sort -n)

          if [ -z "$ready" ]; then
            echo "No PRs ready for merge."
            exit 0
          fi

          for num in $ready; do
            echo "=== Merging PR #$num ==="

            # Build the squash commit body: start with the PR's Summary
            # section, then append any issue-closing keywords found anywhere
            # in the PR body. GitHub's auto-close only fires on keywords that
            # end up in the default-branch commit message, so surfacing them
            # here means authors can write "Fixes #N" in whichever section
            # feels natural and still get the issue closed on merge.
            pr_full_body=$(gh api "repos/$REPO/pulls/$num" --jq '.body')

            pr_body=$(printf '%s' "$pr_full_body" \
              | sed -n '/^\*\*Summary\*\*$/,/^\*\*[A-Z]/p' \
              | sed '1d; $d' \
              | sed '/^[[:space:]]*$/d')

            # Scan the full body for closing keywords (close/closes/closed/
            # fix/fixes/fixed/resolve/resolves/resolved) followed by #N.
            # Tolerate a trailing punctuation mark after the issue number,
            # but strip it so the emitted line is the canonical "Fixes #N"
            # form GitHub's parser always recognises. Case-insensitive.
            closing_lines=$(printf '%s' "$pr_full_body" \
              | grep -ioE '\b(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | sed -E 's/[[:space:]]+/ /g' \
              | awk '{ keyword=tolower($1);
                       issue=$2;
                       # Strip any trailing punctuation the regex may have
                       # pulled in (e.g. "#144." from "Fixes #144.").
                       sub(/[^0-9]+$/, "", issue);
                       # Normalise to the plural "Fixes/Closes/Resolves" form.
                       if (keyword ~ /^fix/)       kw="Fixes";
                       else if (keyword ~ /^close/)  kw="Closes";
                       else if (keyword ~ /^resolve/) kw="Resolves";
                       print kw, issue }' \
              | sort -u)

            if [ -n "$closing_lines" ]; then
              # Drop any closing lines that are already present verbatim in
              # the Summary section so we don't duplicate them.
              new_closings=""
              while IFS= read -r line; do
                if ! printf '%s' "$pr_body" | grep -qiF "$line"; then
                  new_closings="${new_closings}${line}"$'\n'
                fi
              done <<< "$closing_lines"
              new_closings=$(printf '%s' "$new_closings" | sed '/^[[:space:]]*$/d')
              if [ -n "$new_closings" ]; then
                pr_body=$(printf '%s\n\n%s' "$pr_body" "$new_closings")
              fi
            fi

            # Capture head repo + branch for fork cleanup.
            head_owner=$(echo "$prs_json" | jq -r --argjson n "$num" \
              '.[] | select(.number == $n) | .headRepositoryOwner.login')
            head_repo_name=$(echo "$prs_json" | jq -r --argjson n "$num" \
              '.[] | select(.number == $n) | .headRepository.name')
            head_branch=$(echo "$prs_json" | jq -r --argjson n "$num" \
              '.[] | select(.number == $n) | .headRefName')
            head_repo="$head_owner/$head_repo_name"

            # Merge directly (synchronous).
            if gh pr merge "$num" --squash --delete-branch --body "$pr_body"; then
              echo "  Merged and upstream branch deleted."
            else
              echo "  Merge failed — PR may have been merged by another path."
              continue
            fi

            # For cross-fork PRs, --delete-branch only removes the branch
            # in the upstream repo.  Delete the fork branch separately.
            if [ "$head_repo" != "$REPO" ] && [ -n "$head_repo" ] && [ "$head_repo" != "null/null" ]; then
              echo "  Deleting fork branch $head_repo:$head_branch ..."
              gh api -X DELETE "repos/$head_repo/git/refs/heads/$head_branch" 2>&1 \
                && echo "  Fork branch deleted." \
                || echo "  (could not delete fork branch — token may lack scope)"
            fi
          done
