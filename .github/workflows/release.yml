name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # macOS + Linux: LLVM-enabled native build with statically-linked LLVM.
  # LLVM is compiled from source with -ffunction-sections so dead-code
  # elimination drops unreferenced symbols at link time, producing a
  # self-contained binary under 15 MB — no shared library bundling needed.
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kinglet-linux-x64
            llvm_target: X86
            llvm_cache_key: llvm-22.1.0-linux-x64-ffs-v1
          - os: macos-latest
            artifact: kinglet-macos-arm64
            llvm_target: AArch64
            llvm_cache_key: llvm-22.1.0-macos-arm64-ffs-v1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GN
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            curl -Lo gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/mac-arm64/+/latest"
          else
            curl -Lo gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          fi
          unzip gn.zip -d "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache LLVM
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: ~/llvm-install
          key: ${{ matrix.llvm_cache_key }}
          save-always: true

      - name: Build LLVM from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LLVM_VER=22.1.0
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          echo "Building LLVM $LLVM_VER (${{ matrix.llvm_target }} only, -ffunction-sections)..."

          # Install build deps
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake 2>/dev/null || true
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang cmake
          fi

          echo "Downloading $LLVM_URL"
          curl -fSL --retry 5 --retry-delay 15 --retry-max-time 300 \
            -o llvm.tar.xz "$LLVM_URL"
          echo "Downloaded $(du -h llvm.tar.xz | cut -f1)"

          mkdir -p /tmp/llvm-src /tmp/llvm-build
          mkdir -p ~/llvm-install

          # Extract only what we need: llvm/, cmake/, third-party/ (for siphash).
          tar xf llvm.tar.xz -C /tmp/llvm-src --strip-components=1 \
            "llvm-project-${LLVM_VER}.src/llvm" \
            "llvm-project-${LLVM_VER}.src/cmake" \
            "llvm-project-${LLVM_VER}.src/third-party"

          cd /tmp/llvm-build
          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=clang
            -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections"
            -DLLVM_TARGETS_TO_BUILD=${{ matrix.llvm_target }}
            -DLLVM_BUILD_TOOLS=OFF
            -DLLVM_BUILD_TESTS=OFF
            -DLLVM_BUILD_EXAMPLES=OFF
            -DLLVM_INCLUDE_TESTS=OFF
            -DLLVM_INCLUDE_EXAMPLES=OFF
            -DLLVM_INCLUDE_BENCHMARKS=OFF
            -DLLVM_ENABLE_TERMINFO=OFF
            -DLLVM_ENABLE_ZLIB=OFF
            -DLLVM_ENABLE_ZSTD=OFF
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_INSTALL_PREFIX=$HOME/llvm-install
          )
          # GNU-only linker flags; Apple's ld64 rejects --gc-sections/--strip-all.
          if [ "$RUNNER_OS" != "macOS" ]; then
            CMAKE_ARGS+=(-DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--strip-all")
          fi
          cmake /tmp/llvm-src/llvm "${CMAKE_ARGS[@]}"
          ninja install-llvm-libraries install-llvm-headers llvm-config

          # install-llvm-libraries + install-llvm-headers don't install
          # llvm-config itself — the binary lives in the build tree.
          # Copy it manually.  bin/ isn't created by those targets on
          # Unix (shared libs go to lib/ instead), so create it first.
          mkdir -p ~/llvm-install/bin
          cp /tmp/llvm-build/bin/llvm-config ~/llvm-install/bin/

          # Clean up source/build trees to save space (cache only the install).
          rm -rf /tmp/llvm-src /tmp/llvm-build llvm.tar.xz

          echo "LLVM build complete ($(du -sh ~/llvm-install | cut -f1))"

      - name: Set LLVM config path
        shell: bash
        run: |
          echo "LLVM_CONFIG=$HOME/llvm-install/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Generate build files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gn gen out/Release --args="is_debug=false enable_llvm=true llvm_link_static=true llvm_config=\"$LLVM_CONFIG\" kinglet_version=\"$VERSION\""

      - name: Build
        shell: bash
        run: ninja -C out/Release kinglet kinglet_rt

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cp out/Release/kinglet dist/
          # Native backend links user programs against the static runtime; it must
          # sit beside the kinglet binary (see resolve_rt_lib in compiler/driver/kinglet/main.cc).
          cp out/Release/obj/runtime/libkinglet_rt.a dist/
          bash scripts/stage-klet-alias.sh dist
          cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # Windows builds kinglet with LLVM statically linked to avoid bundling the
  # 140 MB libLLVM.dll.  Because MSYS2's LLVM package is a shared-library build
  # whose .a files lack -ffunction-sections, we compile LLVM from source here
  # with dead-code-elimination flags.  The build is cached so only the first
  # release after a cache miss pays the full compile cost (~40 min).  Cache-hit
  # builds restore the install tree instantly.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            unzip
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Cache LLVM
        uses: actions/cache@v4
        id: cache-llvm
        with:
          # /llvm-install in MSYS2 maps to $RUNNER_TEMP/msys64/llvm-install on
          # the host filesystem.  The cache action runs outside MSYS2, so the
          # path must be a Windows host path.
          path: ${{ runner.temp }}/msys64/llvm-install
          key: llvm-22.1.0-x86-ffs-v3
          save-always: true

      - name: Build LLVM from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          LLVM_VER=22.1.0
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          echo "Building LLVM $LLVM_VER (X86 only, -ffunction-sections)..."
          echo "Downloading $LLVM_URL"
          # --retry handles transient failures; -S shows errors.
          # GitHub release asset redirects go through two hops and MSYS2 curl
          # occasionally drops the connection mid-chain.
          curl -fSL --retry 5 --retry-delay 15 --retry-max-time 300 \
            -o llvm.tar.xz "$LLVM_URL"
          CURL_EXIT=$?
          if [ $CURL_EXIT -ne 0 ]; then
            echo "curl exit code: $CURL_EXIT"
            ls -lh llvm.tar.xz 2>/dev/null || echo "(no file)"
            file llvm.tar.xz 2>/dev/null || true
            exit 1
          fi
          echo "Downloaded $(du -h llvm.tar.xz | cut -f1)"
          mkdir -p /llvm-src /llvm-build /llvm-install
          # Only extract llvm/, cmake/, and top-level CMakeLists.txt.
          # The tarball includes clang/lld/flang/etc. with symlinks in test
          # directories that fail on Windows.  We don't need any of that.
          tar xf llvm.tar.xz -C /llvm-src --strip-components=1 \
            --exclude='*/test' \
            --exclude='*/mlgo-utils' \
            --exclude='*/benchmarks' \
            --exclude='*/examples' \
            "llvm-project-${LLVM_VER}.src/llvm" \
            "llvm-project-${LLVM_VER}.src/cmake" \
            "llvm-project-${LLVM_VER}.src/third-party"
          # mlgo-utils contains symlinks that fail on Windows, so we
          # exclude it above.  LLVM's top-level CMakeLists.txt calls
          # add_subdirectory on it unconditionally — supply a stub so
          # cmake configure succeeds.  MLGO is not needed for the
          # X86 backend libraries we are building.
          mkdir -p /llvm-src/llvm/utils/mlgo-utils
          : > /llvm-src/llvm/utils/mlgo-utils/CMakeLists.txt
          cd /llvm-build
          cmake /llvm-src/llvm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--strip-all" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/llvm-install
          ninja install-llvm-libraries install-llvm-headers llvm-config
          # install-llvm-libraries + install-llvm-headers only install
          # libraries and headers; ninja builds llvm-config in the build
          # tree but does not install it.  Copy it manually.
          cp /llvm-build/bin/llvm-config.exe /llvm-install/bin/

      - name: Install GN
        run: |
          curl -Lo gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/latest"
          unzip -o gn.zip -d /usr/bin

      - name: Generate build files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYW="$(cygpath -m "$pythonLocation")/python.exe"
          LLVMW="$(cygpath -m /llvm-install/bin/llvm-config)"
          CLANG_BASE="$(cygpath -m /mingw64/bin)"
          gn gen out/Release \
            --script-executable="$PYW" \
            --args="is_debug=false enable_llvm=true llvm_link_static=true llvm_config=\"$LLVMW\" clang_base_path=\"$CLANG_BASE\" kinglet_version=\"$VERSION\""

      - name: Build
        run: ninja -C out/Release kinglet kinglet_rt

      - name: Package binaries
        run: |
          mkdir -p dist
          cp out/Release/kinglet.exe dist/
          cp out/Release/obj/runtime/kinglet_rt.lib dist/
          bash scripts/stage-klet-alias.sh dist
          bash scripts/stage-runtime-dlls.sh dist
          cd dist && tar czf "../kinglet-windows-x64.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinglet-windows-x64
          path: kinglet-windows-x64.tar.gz

  release:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and checksums
        run: |
          mkdir -p out
          find artifacts -name '*.tar.gz' -exec cp {} out/ \;
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Resolve changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG="docs/changelog/v${VERSION}.md"
          if [ -f "$CHANGELOG" ]; then
            echo "body_path=$CHANGELOG" >> $GITHUB_OUTPUT
          else
            echo "body_path=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # SemVer pre-releases carry a hyphen (e.g. v0.1.0-rc.1); flag them so
          # they do not become the "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.changelog.outputs.body_path || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.body_path == '' }}
          files: |
            out/kinglet-windows-x64.tar.gz
            out/kinglet-linux-x64.tar.gz
            out/kinglet-macos-arm64.tar.gz
            out/SHA256SUMS
