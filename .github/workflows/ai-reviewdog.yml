name: AI Reviewdog

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [canon]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ai-reviewdog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Reviewdog
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with repository secrets.  Do not check out or
      # execute the PR head here.  The reviewer script reads PR patches and file
      # contents through the GitHub API instead.
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run AI review through reviewdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEWDOG_INCLUDE_WARNINGS: "false"
          AI_REVIEWDOG_MIN_BLOCKING_CONFIDENCE: "0.75"
        run: |
          python3 scripts/ai_reviewdog.py \
            | reviewdog \
                -f=rdjsonl \
                -name="kinglet-ai-reviewdog" \
                -reporter=github-pr-review \
                -filter-mode=diff_context \
                -fail-level=error
