name: CI

on:
  pull_request:
    branches: [canon]
  push:
    branches: [canon]

jobs:
  build-and-test-unix:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Debug

      - name: Run full test suite
        shell: bash
        run: |
          ninja -C out/Debug nest_parser_test
          export KINGLET="$PWD/out/Debug/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Debug"
          bash tests/run_all.sh

  release-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Release --gn 'optimize="-O2"'

      - name: Run full test suite
        shell: bash
        run: |
          ninja -C out/Release nest_parser_test
          export KINGLET="$PWD/out/Release/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Release"
          bash tests/run_all.sh

  sanitizers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Sanitizers --gn 'sanitizer="address,undefined,leak"'

      - name: Run full test suite
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ninja -C out/Sanitizers nest_parser_test
          export KINGLET="$PWD/out/Sanitizers/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Sanitizers"
          bash tests/run_all.sh

  fuzz-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      # Build the libFuzzer targets with ASan+UBSan and run a short time-boxed
      # smoke of each front-end fuzzer starting from the committed seed corpus.
      # This replays the regression seeds (past crashes/OOMs) on every PR and
      # spends a small budget hunting for new defects. It is intentionally short
      # to keep CI fast; deeper fuzzing runs are meant to be launched manually
      # via scripts/fuzz.sh with a larger time budget.
      - name: Build and run fuzz smoke
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          bash scripts/fuzz.sh all 60

      # scripts/fuzz.sh writes crash-*/oom-*/timeout-* artifacts next to the
      # tracked corpus (tests/fuzz/corpus/<target>/) on a defect. Upload them
      # so a failing run can be triaged from the Actions UI without having to
      # reproduce locally first.
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            tests/fuzz/corpus/*/crash-*
            tests/fuzz/corpus/*/oom-*
            tests/fuzz/corpus/*/timeout-*
          if-no-files-found: ignore

  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Release --gn 'optimize="-O2"'

      - name: Run benchmarks
        shell: bash
        run: |
          bash tests/bench/run.sh out/Release/kinglet

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Coverage --gn 'coverage=true'

      - name: Run full test suite
        shell: bash
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/profraw/%p.profraw"
        run: |
          mkdir -p profraw
          ninja -C out/Coverage nest_parser_test
          export KINGLET="$PWD/out/Coverage/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Coverage"
          bash tests/run_all.sh

      - name: Generate coverage report
        shell: bash
        run: |
          LLVM_BIN="$(dirname "$LLVM_CONFIG")"
          export PATH="$LLVM_BIN:$PATH"
          llvm-profdata merge -sparse profraw/*.profraw -o coverage.profdata
          llvm-cov export \
            out/Coverage/kinglet \
            -instr-profile=coverage.profdata \
            -format=lcov \
            -ignore-filename-regex='(tests/|out/|/usr/)' \
            > coverage.lcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  build-and-test-windows:
    # Build with the MSYS2 MinGW toolchain — the same one release uses and the
    # one docs/BUILD.md mandates for the native backend. The PATH clang on
    # windows-latest is the MSVC-ABI llvm.org build; it uses different headers
    # and silently masks MinGW-only issues (e.g. the runtime's missing <io.h>
    # include that broke _close). kinglet_rt is LLVM-independent, so it is
    # always compiled and Windows-only runtime regressions are caught on every
    # PR regardless of whether the LLVM cache is warm.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            diffutils
            unzip
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # Restore the LLVM install tree primed by prime-llvm-cache.yml (same key
      # release.yml uses). PRs never build LLVM from source (~40 min); a cache
      # miss degrades to a MinGW compile-only build that still compiles
      # kinglet_rt, so runtime regressions are still caught.
      - name: Restore LLVM cache
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/msys64/llvm-install
          key: llvm-22.1.0-x86-ffs-v3

      - name: Install GN
        run: |
          curl -Lo gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/latest"
          unzip -o gn.zip -d /usr/bin

      - name: Generate build files (with LLVM backend)
        if: steps.cache-llvm.outputs.cache-hit == 'true'
        run: |
          PYW="$(cygpath -m "$pythonLocation")/python.exe"
          LLVMW="$(cygpath -m /llvm-install/bin/llvm-config)"
          CLANG_BASE="$(cygpath -m /mingw64/bin)"
          gn gen out/Debug --script-executable="$PYW" \
            --args="is_debug=true enable_llvm=true llvm_link_static=true llvm_config=\"$LLVMW\" clang_base_path=\"$CLANG_BASE\""

      - name: Generate build files (compile-only, MinGW clang)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          echo "::warning::LLVM cache miss — compile-only with MinGW clang (no native backend / native tests). Re-run the 'Prime LLVM Cache' workflow to restore full coverage."
          PYW="$(cygpath -m "$pythonLocation")/python.exe"
          CLANG_BASE="$(cygpath -m /mingw64/bin)"
          gn gen out/Debug --script-executable="$PYW" \
            --args="is_debug=true clang_base_path=\"$CLANG_BASE\""

      - name: Build compiler, runtime, and test support
        run: ninja -C out/Debug kinglet kinglet_rt nest_parser_test

      - name: Run full test suite (incl. native execution)
        if: steps.cache-llvm.outputs.cache-hit == 'true'
        run: |
          export KINGLET="$PWD/out/Debug/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Debug"
          bash tests/run_all.sh

      - name: Run golden suites (compile-only)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          export KINGLET="$PWD/out/Debug/kinglet"
          export KINGLET_SKIP_RUN=1
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Debug"
          bash tests/sema/run.sh
          bash tests/parser/run.sh
          bash tests/codegen/run.sh
          bash tests/ir/run.sh

      - name: Compile smoke
        run: |
          ./out/Debug/kinglet.exe --check tests/exec/cases/structs_basic.kl
          ./out/Debug/kinglet.exe --ir tests/exec/cases/structs_basic.kl >/dev/null
