name: CI

on:
  pull_request:
    branches: [canon]
  push:
    branches: [canon]

jobs:
  build-and-test-unix:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Debug

      - name: Run full test suite
        shell: bash
        run: |
          ninja -C out/Debug nest_parser_test
          export KINGLET="$PWD/out/Debug/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Debug"
          bash tests/run_all.sh

  release-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Release --gn 'optimize="-O2"'

      - name: Run full test suite
        shell: bash
        run: |
          ninja -C out/Release nest_parser_test
          export KINGLET="$PWD/out/Release/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Release"
          bash tests/run_all.sh

  sanitizers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Sanitizers --gn 'sanitizer="address,undefined,leak"'

      - name: Run full test suite
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ninja -C out/Sanitizers nest_parser_test
          export KINGLET="$PWD/out/Sanitizers/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Sanitizers"
          bash tests/run_all.sh

  fuzz-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      # Build the libFuzzer targets with ASan+UBSan and run a short time-boxed
      # smoke of each front-end fuzzer starting from the committed seed corpus.
      # This replays the regression seeds (past crashes/OOMs) on every PR and
      # spends a small budget hunting for new defects. It is intentionally short
      # to keep CI fast; deeper fuzzing runs are meant to be launched manually
      # via scripts/fuzz.sh with a larger time budget.
      - name: Build and run fuzz smoke
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          bash scripts/fuzz.sh all 60

  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Release --gn 'optimize="-O2"'

      - name: Run benchmarks
        shell: bash
        run: |
          bash tests/bench/run.sh out/Release/kinglet

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        shell: bash
        run: |
          LLVM_CONFIG=$(bash scripts/setup.sh --install)
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "$PWD/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          BUILD_CI: 1
        run: bash scripts/build.sh --out out/Coverage --gn 'coverage=true'

      - name: Run full test suite
        shell: bash
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/profraw/%p.profraw"
        run: |
          mkdir -p profraw
          ninja -C out/Coverage nest_parser_test
          export KINGLET="$PWD/out/Coverage/kinglet"
          export KINGLET_SKIP_REBUILD=1
          export NEST_TEST_OUT="$PWD/out/Coverage"
          bash tests/run_all.sh

      - name: Generate coverage report
        shell: bash
        run: |
          LLVM_BIN="$(dirname "$LLVM_CONFIG")"
          export PATH="$LLVM_BIN:$PATH"
          llvm-profdata merge -sparse profraw/*.profraw -o coverage.profdata
          llvm-cov export \
            out/Coverage/kinglet \
            -instr-profile=coverage.profdata \
            -format=lcov \
            -ignore-filename-regex='(tests/|out/|/usr/)' \
            > coverage.lcov

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  build-and-test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned toolchain (GN + Ninja)
        shell: pwsh
        run: |
          pwsh -File scripts/setup.ps1
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\tools\bin"

      - name: Build
        shell: pwsh
        run: pwsh -File scripts/build.ps1 -Out out\Debug

      - name: Run golden tests (compile-only)
        shell: bash
        run: |
          export KINGLET="$PWD/out/Debug/kinglet"
          export KINGLET_SKIP_RUN=1
          export KINGLET_SKIP_REBUILD=1
          bash tests/sema/run.sh
          bash tests/parser/run.sh
          bash tests/codegen/run.sh
          bash tests/ir/run.sh

      - name: Compile smoke
        shell: bash
        run: |
          ./out/Debug/kinglet.exe --check tests/exec/cases/structs_basic.kl
          ./out/Debug/kinglet.exe --ir tests/exec/cases/structs_basic.kl >/dev/null
